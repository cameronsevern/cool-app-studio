name: Feature request
description: Propose a focused improvement grounded in the local-first product contract.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What outcome is difficult today, and for whom?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Smallest useful change
      description: Describe the narrowest complete improvement you would use.
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Local-first and compatibility impact
      description: Note any networking, persistence, project schema, CLI, or renderer implications.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
